
name: Update Profile Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Generate profile stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: Bhargav-92
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          from pathlib import Path

          user = os.environ["GH_USER"]
          token = os.environ["GH_TOKEN"]

          def api(path):
              req = urllib.request.Request(
                  "https://api.github.com" + path,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "profile-stats"
                  }
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          profile = api(f"/users/{user}")

          repos = []
          page = 1

          while True:
              batch = api(
                  f"/users/{user}/repos?per_page=100"
                  f"&page={page}&type=owner"
              )
              repos.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          public_repos = [
              repo for repo in repos
              if not repo["private"]
          ]

          stars = sum(
              repo["stargazers_count"]
              for repo in public_repos
          )
          forks = sum(
              repo["forks_count"]
              for repo in public_repos
          )

          def search_count(query):
              from urllib.parse import quote
              result = api(
                  "/search/issues?q=" + quote(query)
                  + "&per_page=1"
              )
              return result["total_count"]

          prs = search_count(f"author:{user} type:pr")
          issues = search_count(f"author:{user} type:issue")

          stats = f"""
          <table>
          <tr>
          <td width="50%" valign="top">

          <h3>📦 Repository Stats</h3>

          <p>📁 Repositories: <b>{profile['public_repos']}</b></p>
          <p>⭐ Stars Earned: <b>{stars}</b></p>
          <p>⑂ Forks: <b>{forks}</b></p>

          </td>
          <td width="50%" valign="top">

          <h3>📈 Activity</h3>

          <p>🔀 Pull Requests: <b>{prs}</b></p>
          <p>📝 Issues Opened: <b>{issues}</b></p>
          <p>👥 Followers: <b>{profile['followers']}</b></p>

          </td>
          </tr>
          </table>
          """

          readme = Path("README.md")
          content = readme.read_text(encoding="utf-8")

          start = "<!-- PROFILE STATS START -->"
          end = "<!-- PROFILE STATS END -->"

          if start not in content or end not in content:
              raise SystemExit("README markers not found")

          before, rest = content.split(start, 1)
          _, after = rest.split(end, 1)

          content = (
              before + start + "\n"
              + stats.strip() + "\n"
              + end + after
          )

          readme.write_text(content, encoding="utf-8")
          PY

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: update profile stats"
            git push
          fi
