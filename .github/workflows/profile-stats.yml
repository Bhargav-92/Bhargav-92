name: Refresh profile cards

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"
  push:
    branches: [master]
    paths:
      - .github/workflows/profile-stats.yml
      - scripts/render_readme_cards.py

permissions:
  contents: write

concurrency: profile-cards

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Refresh the calendar and render SVG cards
        run: python3 scripts/render_readme_cards.py --refresh
      - name: Publish updated cards
        run: |
          git add cards data/contributions.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh profile contribution cards"
          git pull --rebase origin master
          git push origin HEAD:master
