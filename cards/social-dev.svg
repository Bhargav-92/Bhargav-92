<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44" role="img"><title>dev</title>
<style>
.rise { animation: rise 680ms cubic-bezier(.2,.8,.2,1) both }
.pop { animation: pop 470ms ease-out both }
.grow { transform-box:fill-box; transform-origin:bottom; animation:grow 740ms ease-out both }
@keyframes rise { from { opacity:0; transform:translateY(10px) } }
@keyframes pop { from { opacity:0 } }
@keyframes grow { from { opacity:.25; transform:scaleY(.06) } }
@media (prefers-reduced-motion: reduce) { .rise,.pop,.grow { animation:none !important } }
</style><rect x=".5" y=".5" width="43" height="43" rx="17" fill="#0d1117" stroke="#30363d"/><g transform="translate(10 10)" color="#e6edf3"><text x="12" y="15.5" text-anchor="middle" fill="currentColor" font-size="9" font-weight="bold" font-family="monospace">DEV</text></g></svg>
