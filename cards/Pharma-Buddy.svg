<svg xmlns="http://www.w3.org/2000/svg" width="800" height="96" viewBox="0 0 800 96" role="img"><title>Pharma-Buddy, Pharmacy website</title>
<style>
.rise { animation: rise 680ms cubic-bezier(.2,.8,.2,1) both }
.pop { animation: pop 470ms ease-out both }
.grow { transform-box:fill-box; transform-origin:bottom; animation:grow 740ms ease-out both }
@keyframes rise { from { opacity:0; transform:translateY(10px) } }
@keyframes pop { from { opacity:0 } }
@keyframes grow { from { opacity:.25; transform:scaleY(.06) } }
@media (prefers-reduced-motion: reduce) { .rise,.pop,.grow { animation:none !important } }
</style><rect x=".5" y=".5" width="799" height="95" rx="17" fill="#f3f7ff" stroke="#b7c9ee"/><g class="rise" style="animation-delay:1140ms"><text x="26" y="44" fill="#15284c" font-family="Georgia" font-size="27" text-anchor="start">Pharma-Buddy</text><text x="27" y="73" fill="#496184" font-family="sans-serif" font-size="16" text-anchor="start">Pharmacy website</text><text x="769" y="43" fill="#174bbb" font-family="monospace" font-size="14" text-anchor="end">JAVASCRIPT</text></g></svg>
